# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE.BRIDGE.IDENTITY
# TAG: LEEWAY.POCKET_ID.SINGLE_AUTHORITY
# WHO: LeeWay Industries / owner-approved deployment
# WHAT: Optional Pocket ID identity companion for the canonical Device Bridge distribution
# WHY: One free self-hosted OAuth/OIDC authority shared by all LeeWay applications
# WHERE: operator/identity/pocket-id.compose.yml
# WHEN: 2026-10-25
# HOW: One persistent Pocket ID instance; clients consume its existing OIDC endpoints
# AUTHORITY: Identity service only; Device Bridge execution grants remain separate
# LICENSE: MIT
#
# Deploy on ONE persistent authorized host, NOT separately on every client device.
# Production requires HTTPS and owner passkey setup; never publish port 1411 directly.
services:
  leeway-pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1411:1411"
    environment:
      APP_URL: ${LEEWAY_POCKET_ID_APP_URL:?Set an HTTPS URL for the approved issuer}
      ENCRYPTION_KEY: ${LEEWAY_POCKET_ID_ENCRYPTION_KEY:?Set a secure random encryption key outside GitHub}
      ANALYTICS_DISABLED: "true"
    volumes:
      - leeway-pocket-id-data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 90s
      timeout: 5s
      retries: 2
      start_period: 10s

volumes:
  leeway-pocket-id-data:
