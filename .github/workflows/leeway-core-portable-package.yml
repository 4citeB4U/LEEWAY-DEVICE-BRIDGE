name: LeeWay Core Portable Package

on:
  pull_request:
  push:
    branches: [main, repair/universal-relay-20261116]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --release
      - run: node --test tests/device-relay-server.test.mjs tests/rust-registry-adapter.test.mjs tests/sovereign-package.test.mjs tests/browser-extension-package.test.mjs tests/browser-local-gateway.test.mjs
      - name: Hash portable core
        shell: bash
        run: |
          if [ -f target/release/leeway-core.exe ]; then
            node -e "const fs=require('fs'),c=require('crypto');const p='target/release/leeway-core.exe';console.log(c.createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'  '+p)"
          else
            shasum -a 256 target/release/leeway-core
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: leeway-core-${{ matrix.os }}
          path: |
            target/release/leeway-core
            target/release/leeway-core.exe
            bootstrap.ps1
            bootstrap.sh
            scripts/generate-device-key.mjs
            scripts/start-leeway-core.ps1
            scripts/mesh-replication-worker.mjs
            operator/browser-local-gateway.mjs
            operator/browser-native-host.mjs
            apps/extension
          if-no-files-found: error

  windows-production-signing-gate:
    runs-on: windows-latest
    needs: qualify
    steps:
      - name: Production signing custody gate
        shell: pwsh
        env:
          CERTIFICATE_PRESENT: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PFX != '' }}
        run: |
          if ($env:CERTIFICATE_PRESENT -ne 'true') {
            Write-Output 'WINDOWS_PRODUCTION_SIGNING_NOT_CONFIGURED'
            Write-Output 'Unsigned artifacts remain release candidates and may not be promoted to production.'
            exit 1
          }
          Write-Output 'WINDOWS_PRODUCTION_SIGNING_CREDENTIAL_CONFIGURED'
