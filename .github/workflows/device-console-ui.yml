# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE.BRIDGE.CI
# TAG: LEEWAY.DEVICE.CONSOLE.SOURCE.ACCEPTANCE.V1
# WHO: LeeWay Industries
# WHAT: Validate the browser console and preserved PWA hooks
# WHEN: 2026-11-02
# WHERE: .github/workflows/device-console-ui.yml
# WHY: Prevent static UI regressions and broken platform controls
# HOW: Dependency-free Node source tests with a pinned checkout action
# AUTHORITY: Source CI only; not live Runtime Fabric or device authorization
# LICENSE: MIT
name: Device Console UI Acceptance
on:
  push:
    paths:
      - 'docs/index.html'
      - 'docs/dashboard.css'
      - 'docs/dashboard-ui.js'
      - 'docs/sw.js'
      - 'tests/device-dashboard-ui.test.mjs'
      - '.github/workflows/device-console-ui.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/dashboard.css'
      - 'docs/dashboard-ui.js'
      - 'docs/sw.js'
      - 'tests/device-dashboard-ui.test.mjs'
      - '.github/workflows/device-console-ui.yml'
permissions:
  contents: read
jobs:
  source-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm Node available
        run: node --version
      - name: Check browser controller JavaScript syntax
        run: node --check docs/dashboard-ui.js
      - name: Run Device Console source acceptance
        run: node --test tests/device-dashboard-ui.test.mjs
      - name: Preserve existing Apple PWA behavior
        run: node tests/apple-pwa-source.test.mjs
