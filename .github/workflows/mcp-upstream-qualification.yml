# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE.BRIDGE.DEPLOYMENT.QUALIFICATION
# TAG: LEEWAY.MCP.VERCEL.PUBLIC_OAUTH_DISCOVERY.V2
# WHO: LeeWay Industries
# WHAT: Qualify an explicitly supplied Vercel public MCP /mcp endpoint and its Pocket ID metadata
# WHEN: 2026-10-26
# WHERE: .github/workflows/mcp-upstream-qualification.yml
# WHY: Remove the retired Fly target and prevent warnings/SSO pages from becoming green qualification
# HOW: Manual, credential-free initialize refusal plus exact path-scoped OAuth metadata checks
# AUTHORITY: Discovery only; does not prove authenticated tool execution or device authority
# LICENSE: MIT
name: Public MCP OAuth discovery qualification

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Authorized public Vercel Device Bridge URL ending in /mcp"
        required: true
        type: string
      expected_issuer:
        description: "Exact HTTPS issuer advertised by Pocket ID discovery"
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public MCP OAuth discovery
        env:
          LEEWAY_PUBLIC_MCP_ENDPOINT: ${{ inputs.endpoint }}
          LEEWAY_MCP_EXPECTED_ISSUER: ${{ inputs.expected_issuer }}
        run: node operator/identity/qualify-public-mcp-endpoint.mjs
