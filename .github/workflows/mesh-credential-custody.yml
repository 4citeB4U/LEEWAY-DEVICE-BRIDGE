# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE_BRIDGE.SECURITY.CI.MESH_SECRET
# TAG: LEEWAY.CI.MESH_CREDENTIAL_CUSTODY.V1
# DISCOVERY_PIPELINE: Voice → Intent → Location → Vertical → Ranking → Render
# 5WH:
# WHAT = Reject source embedded mesh credential and test absent host token behavior.
# WHY = Preserve owner identity and tenant/device rights at the relay.
# WHO = Original Device Bridge release and credential custodian.
# WHERE = .github/workflows/mesh-credential-custody.yml.
# WHEN = 2026-11-12.
# HOW = Node source-based credential leak and handshake precondition checks.
# LICENSE: Existing repository terms remain unchanged.
name: Device Bridge Mesh Credential Custody
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-mesh-token-custody.mjs
      - run: node --test tests/mesh-credential-custody.test.mjs
