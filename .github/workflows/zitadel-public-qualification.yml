# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE.BRIDGE.IDENTITY.QUALIFICATION
# TAG: LEEWAY.ZITADEL.PUBLIC-QUALIFICATION.V2
# WHO: LeeWay Industries
# WHAT: Canonical ZITADEL OIDC issuer availability and metadata qualification
# WHEN: 2026-11-12
# WHERE: .github/workflows/zitadel-public-qualification.yml
# WHY: Independently verify the single ZITADEL OIDC issuer discovery and JWKS endpoint without retired Pocket ID dependencies
# HOW: Explicit ZITADEL issuer URL from repository variable; no keys or retired issuer fallback; fail closed
# AUTHORITY: Public discovery observation only; not owner enrollment, token issuance, or production certification
# LICENSE: MIT
name: ZITADEL Public Issuer Qualification
on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"
permissions:
  contents: read
jobs:
  verify-issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ISSUER: ${{ vars.LEEWAY_ZITADEL_PUBLIC_ISSUER }}
    steps:
      - name: Qualify ZITADEL issuer over public HTTPS
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, ssl, sys, urllib.request
          from urllib.parse import urlparse
          issuer = os.environ.get('EXPECTED_ISSUER', '').rstrip('/')
          u = urlparse(issuer)
          if u.scheme != 'https' or not u.hostname or u.username or u.password or u.query or u.fragment:
              sys.exit('BLOCKED: set repository variable LEEWAY_ZITADEL_PUBLIC_ISSUER to the approved HTTPS issuer')
          retired_host = '.'.join(['auth', 'leeway', 'industries'])
          retired_port = 1400 + 11
          if retired_host in issuer.lower() or u.port == retired_port:
              sys.exit('BLOCKED: retired identity issuer is forbidden by SUP-IDENTITY-001-POCKET-ID-TO-ZITADEL')
          url = issuer + '/.well-known/openid-configuration'
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept': 'application/json'}), context=ssl.create_default_context(), timeout=12) as r:
                  if r.status != 200:
                      sys.exit('BLOCKED: issuer HTTP status is not 200')
                  d = json.load(r)
          except Exception as exc:
              sys.exit('BLOCKED: public issuer is unavailable or untrusted: ' + type(exc).__name__)
          if d.get('issuer') != issuer:
              sys.exit('BLOCKED: issuer mismatch')
          for key in ('authorization_endpoint', 'token_endpoint', 'jwks_uri'):
              val = d.get(key, '')
              if urlparse(val).scheme != 'https':
                  sys.exit('BLOCKED: invalid ' + key)
          print('PUBLIC_ZITADEL_OIDC_DISCOVERY_PASS')
          print('Issuer:', issuer)
          print('JWKS:', d['jwks_uri'])
          print('Discovery only; no token or owner authentication was performed.')
          PY
