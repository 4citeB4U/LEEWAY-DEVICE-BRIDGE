name: Device Bridge Dashboard Evidence Truth
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  truthful-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dashboard-evidence-truth.test.mjs
