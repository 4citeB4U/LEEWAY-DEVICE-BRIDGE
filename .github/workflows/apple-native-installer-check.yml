# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE_BRIDGE.APPLE_NATIVE_INSTALLER.CI
# TAG: LEEWAY.APPLE.INSTALLER.NATIVE_BUILD_GATE
# 5WH:
# WHAT = Compile-check the Device Bridge-owned iLoader-derived native signing worker.
# WHY = Reject unbuildable native code before registration or owner physical qualification.
# WHO = LeeWay Engineering contributors under Creator standards.
# WHERE = .github/workflows/apple-native-installer-check.yml.
# WHEN = 2026-11-07.
# HOW = Pinned checkout, bounded cargo check, source smoke checks, no credentials or device access.
# LICENSE = MIT.
name: Apple Native Installer Source Qualification
on:
  push:
    paths:
      - 'operator/native-apple-installer/**'
      - 'tests/apple-native-installer-source.test.mjs'
      - 'tests/apple-native-runtime-provider.test.mjs'
      - 'operator/physical-adapters.mjs'
      - 'apps/desktop/runtime-composition.mjs'
      - 'apps/desktop/mcp-server.mjs'
      - 'packages/protocol/index.mjs'
      - '.github/workflows/apple-native-installer-check.yml'
  pull_request:
    paths:
      - 'operator/native-apple-installer/**'
      - 'tests/apple-native-installer-source.test.mjs'
      - 'tests/apple-native-runtime-provider.test.mjs'
      - 'operator/physical-adapters.mjs'
      - 'apps/desktop/runtime-composition.mjs'
      - 'apps/desktop/mcp-server.mjs'
      - 'packages/protocol/index.mjs'
      - '.github/workflows/apple-native-installer-check.yml'
permissions:
  contents: read
jobs:
  native-signing-worker:
    name: Compile native Apple installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "QUALIFIED_SOURCE_SHA_MISMATCH" >&2
            exit 1
          fi
          printf 'Qualified source %s\n' "$ACTUAL_SHA"
      - name: Install Linux keyring build headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Record Rust toolchain
        run: cargo --version
      - name: Compile check without device commands
        run: cargo check --manifest-path operator/native-apple-installer/Cargo.toml
      - name: Validate source boundaries
        run: node --test tests/apple-native-installer-source.test.mjs tests/apple-native-runtime-provider.test.mjs
      - name: Build portable first-party LeeWay host installer
        run: cargo build --release --manifest-path operator/native-apple-installer/Cargo.toml
      - name: Exercise installer help without credentials or physical devices
        shell: bash
        run: |
          set -euo pipefail
          EXE="operator/native-apple-installer/target/release/leeway-apple-native-installer"
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="${EXE}.exe"; fi
          "$EXE" --help | grep -F "Free Apple" || "$EXE" --help | grep -F "personal Apple Account"
      - name: Package candidate host installer with binary SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, zipfile, json
          platform = {"Windows":"windows","macOS":"macos","Linux":"linux"}[os.environ["RUNNER_OS"]]
          base = pathlib.Path("operator/native-apple-installer/target/release")
          binary = base / ("leeway-apple-native-installer.exe" if platform=="windows" else "leeway-apple-native-installer")
          if not binary.is_file(): raise SystemExit("HOST_INSTALLER_BINARY_NOT_FOUND")
          output = pathlib.Path("dist"); output.mkdir(exist_ok=True)
          sha = hashlib.sha256(binary.read_bytes()).hexdigest()
          archive = output / ("LeeWay-Apple-Installer-"+platform+(".zip" if platform=="windows" else ".tar.gz"))
          readme = output / "README-APPLE-INSTALLER.txt"
          readme.write_text(
              "LeeWay Apple Native Installer\n"
              "Connect and trust your iPhone/iPad over USB. Open the launcher for your operating system.\n"
              "Choose your device, verify Apple's account prompt and enter the 2FA code locally.\n"
              "A free Apple Account can sign sideloaded apps; paid Developer enrollment or App Store Connect is not required.\n"
              "Free provisioning is temporary and typically needs renewal in seven days.\n"
              "The client is not proof of physical installation or independent Veritas until tested on a real device.\n"
              "Upstream library: nab138/isideload (MIT); nab138/iloader reference source (MIT, separate branding).\n")
          if platform=="windows":
              launcher = output / "START-LEEWAY-APPLE-INSTALLER.cmd"
              launcher.write_bytes(b'@echo off\r\n"%~dp0leeway-apple-native-installer.exe" --install-leeway\r\npause\r\n')
              with zipfile.ZipFile(archive,"w",compression=zipfile.ZIP_DEFLATED) as z:
                  for item in [binary,launcher,readme]: z.write(item,item.name)
          else:
              launcher = output / ("START-LEEWAY-APPLE-INSTALLER.command" if platform=="macos" else "START-LEEWAY-APPLE-INSTALLER.sh")
              launcher.write_text('#!/bin/sh\ncd "$(dirname "$0")"\nexec "./leeway-apple-native-installer" --install-leeway\n')
              launcher.chmod(0o755)
              with tarfile.open(archive,"w:gz") as t:
                  for item in [binary,launcher,readme]: t.add(item,arcname=item.name,recursive=False)
          meta = {"platform":platform,"sourceSha":os.environ["SOURCE_SHA"],
                  "binarySha256":sha,"binarySizeBytes":binary.stat().st_size,
                  "archiveSha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
                  "archiveBytes":archive.stat().st_size,
                  "approval":"CI_CANDIDATE_NOT_PHYSICAL_DEVICE_VERITAS"}
          (output / ("LeeWay-Apple-Installer-"+platform+".sha256.json")).write_text(json.dumps(meta,indent=2)+"\n")
          print(meta)
          PY
      - name: Retain downloadable, unsigned host installer candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leeway-apple-installer-${{ runner.os }}-${{ github.run_id }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
