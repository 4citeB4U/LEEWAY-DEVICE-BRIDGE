name: Pages Contract
on:
  push:
    paths: ["docs/**","tests/pages-contract.test.mjs",".github/workflows/pages-contract.yml"]
  pull_request:
    paths: ["docs/**","tests/pages-contract.test.mjs",".github/workflows/pages-contract.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/pages-contract.test.mjs
