name: Read Aloud Bridge Android Build

concurrency:
  group: read-aloud-bridge-main
  cancel-in-progress: true

on:
  push:
    paths:
      - "apps/read-aloud-android/**"
      - "tests/read-aloud-android-source.test.mjs"
      - ".github/workflows/read-aloud-bridge-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Source qualification
        run: node tests/read-aloud-android-source.test.mjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Read Aloud Bridge
        id: android_build
        working-directory: apps/read-aloud-android
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/read-aloud-gradle.log"
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"
      - name: Hash package
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/read-aloud-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" > apps/read-aloud-android/package-evidence.txt
          echo "sizeBytes=$(stat -c%s "$APK")" >> apps/read-aloud-android/package-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: leeway-read-aloud-bridge-debug-apk
          path: |
            apps/read-aloud-android/app/build/outputs/apk/debug/app-debug.apk
            apps/read-aloud-android/package-evidence.txt
      - name: Publish latest APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          SRC=apps/read-aloud-android/app/build/outputs/apk/debug/app-debug.apk
          DST=docs/downloads/leeway-read-aloud-bridge-latest-debug.apk
          cp "$SRC" "$DST"
          SHA=$(sha256sum "$DST" | awk '{print $1}')
          BYTES=$(stat -c%s "$DST")
          cat > docs/downloads/leeway-read-aloud-bridge-latest.json <<JSON
          {
            "packageId": "industries.leeway.readaloud",
            "versionName": "0.2.0",
            "versionCode": 2,
            "engine": "agent-lee-voice-one",
            "authority": "4citeB4U/LeeWay-Voice-Fabric",
            "sha256": "$SHA",
            "sizeBytes": $BYTES,
            "downloadUrl": "./leeway-read-aloud-bridge-latest-debug.apk",
            "sourceRunId": "${{ github.run_id }}",
            "sourceCommit": "${{ github.sha }}"
          }
          JSON
          git config user.name "LeeWay Veritas"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add "$DST" docs/downloads/leeway-read-aloud-bridge-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified Read Aloud Bridge APK"
          git push origin HEAD:main

      - name: Publish build status receipt
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          STATUS="${{ job.status }}"
          BUILD_RC="${{ steps.android_build.outputs.rc || 'NOT_RUN' }}"
          cat > docs/downloads/leeway-read-aloud-bridge-build-status.json <<JSON
          {
            "workflow": "Read Aloud Bridge Android Build",
            "status": "$STATUS",
            "buildRc": "$BUILD_RC",
            "sourceCommit": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "voicePackageId": "agent-lee-voice-one",
            "authority": "4citeB4U/LeeWay-Voice-Fabric"
          }
          JSON
          if [ -f "$RUNNER_TEMP/read-aloud-gradle.log" ]; then
            tail -n 160 "$RUNNER_TEMP/read-aloud-gradle.log" > docs/downloads/leeway-read-aloud-bridge-build-log.txt
          else
            printf 'Gradle step did not produce a log.\n' > docs/downloads/leeway-read-aloud-bridge-build-log.txt
          fi
          git config user.name "LeeWay Veritas"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add docs/downloads/leeway-read-aloud-bridge-build-status.json docs/downloads/leeway-read-aloud-bridge-build-log.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Evidence Read Aloud Bridge build status"
          git push origin HEAD:main
