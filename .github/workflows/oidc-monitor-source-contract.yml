# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE.BRIDGE.IDENTITY.CI
# TAG: LEEWAY.ZITADEL.METADATA.MONITOR.SOURCE.CI
# 5WH: WHAT=Validate issuer monitor source on PR. WHY=Catch retired issuer and missing gate.
# WHO=LeeWay repo CI. WHERE=.github/workflows/oidc-monitor-source-contract.yml.
# WHEN=2026-11-21. HOW=Node source-only tests. LICENSE=Existing terms.
name: Current OIDC monitor source contract
on:
  pull_request:
    paths:
      - '.github/workflows/pocket-id-public-qualification.yml'
      - '.github/workflows/zitadel-public-qualification.yml'
      - '.github/workflows/oidc-monitor-source-contract.yml'
      - 'tests/zitadel-issuer-monitor.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-issuer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/zitadel-issuer-monitor.test.mjs
