name: Build Official LeeWay PWA Icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/brand/leeway-official-logo.png'
      - '.github/workflows/build-official-pwa-icons.yml'
jobs:
  build-icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical logo checksum
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="456fbfc6aa44a571e8ca3c8a245c955c5709c0f0"
          ACTUAL=$(git hash-object docs/brand/leeway-official-logo.png)
          echo "source_blob_sha=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Generate install icon sizes from exact official artwork
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("docs/brand/leeway-official-logo.png")
          out=Path("docs/icons")
          out.mkdir(parents=True,exist_ok=True)
          im=Image.open(src).convert("RGBA")
          for size in (192,512):
              canvas=im.resize((size,size),Image.Resampling.LANCZOS)
              canvas.save(out/f"leeway-official-logo-{size}.png",format="PNG",optimize=True)
          PY
      - name: Commit generated PWA icons
        shell: bash
        run: |
          git config user.name "LeeWay Veritas"
          git config user.email "actions@users.noreply.github.com"
          git add docs/icons/leeway-official-logo-192.png docs/icons/leeway-official-logo-512.png
          if git diff --cached --quiet; then
            echo "Official PWA icon derivatives unchanged."
            exit 0
          fi
          git commit -m "Generate PWA icons from official LeeWay logo"
          git push origin HEAD:main
