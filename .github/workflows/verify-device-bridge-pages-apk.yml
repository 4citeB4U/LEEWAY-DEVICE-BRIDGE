# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.DEVICE_BRIDGE.CI.RELEASE_HOLD
# TAG: LEEWAY.DEVICE_BRIDGE.CI.HOLD_NO_PUBLIC_APK.V1
# DISCOVERY_PIPELINE: Voice → Intent → Location → Vertical → Ranking → Render
# 5WH:
# WHAT = Enforce a deliberate public installer hold until original Release and Veritas owners authorize exact signed assets.
# WHY = Prevent a debug APK from being published and misleadingly called verified because its SHA matches.
# WHO = Original Device Bridge, Android packaging, release signing and security custodian.
# WHERE = .github/workflows/verify-device-bridge-pages-apk.yml.
# WHEN = 2026-11-12.
# HOW = Read-only source manifest and negative install/publisher tests, not a live Pages or OS trust scan.
# LICENSE: Existing repository terms remain unchanged.
name: Verify Device Bridge Public Release Hold
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/downloads/**"
      - "docs/package-manifest.json"
      - "docs/index.html"
      - "clients/remote-controller/**"
      - "clients/phone-workstation/**"
      - "apps/android/**"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/verify-device-bridge-pages-apk.yml"
      - "scripts/check-public-distribution-hold.mjs"
      - "tests/public-distribution-hold.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-release-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deny unqualified public Android or Apple installers
        run: node scripts/check-public-distribution-hold.mjs
      - name: Confirm held-update and device-owned data safeguards
        run: node --test tests/public-distribution-hold.test.mjs
