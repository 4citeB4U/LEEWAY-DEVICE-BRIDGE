name: Verify Device Bridge Pages Setup Safety

# The old workflow treated a public debug APK as an installation release.
# This is now a fail-closed source gate. Actual signed release qualification
# belongs to the original owner-authenticated native Bridge lifecycle.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/device-bridge-pages-safety.test.mjs"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/verify-device-bridge-pages-apk.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/device-bridge-pages-safety.test.mjs"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/verify-device-bridge-pages-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public Bridge JavaScript
        run: |
          node --check docs/app.js
          node --check docs/dashboard-ui.js
          node --check docs/device-onboarding-policy.mjs
          node --check docs/device-onboarding.js
          node --check docs/sw.js
      - name: Protect against unapproved Android APK links and incorrect mobile setup
        run: node --test tests/device-bridge-pages-safety.test.mjs
