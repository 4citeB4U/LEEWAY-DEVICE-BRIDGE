name: Verify Device Bridge Pages APK

on:
  push:
    branches: [main]
    paths:
      - "docs/downloads/leeway-device-bridge-android-latest.json"
      - "docs/downloads/leeway-device-bridge-android-latest-debug.apk"
      - ".github/workflows/verify-device-bridge-pages-apk.yml"
  workflow_dispatch:

jobs:
  verify-pages-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages latest package
        shell: bash
        run: |
          set -euo pipefail
          META="https://4citeb4u.github.io/LEEWAY-DEVICE-BRIDGE/downloads/leeway-device-bridge-android-latest.json"
          APK="https://4citeb4u.github.io/LEEWAY-DEVICE-BRIDGE/downloads/leeway-device-bridge-android-latest-debug.apk"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 "$META" -o latest.json; then
              VERSION=$(node -e 'const v=require("./latest.json");process.stdout.write(String(v.versionName||""))')
              if [ "$VERSION" = "0.8.2" ]; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" -eq 1
          EXPECTED=$(node -e 'const v=require("./latest.json");process.stdout.write(String(v.sha256||""))')
          curl -fL --max-time 240 "$APK" -o latest.apk
          ACTUAL=$(sha256sum latest.apk | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          BYTES=$(stat -c%s latest.apk)
          echo "version=0.8.2"
          echo "sha256=$ACTUAL"
          echo "bytes=$BYTES"
          printf '%s\n' "{\"versionName\":\"0.8.2\",\"sha256\":\"$ACTUAL\",\"sizeBytes\":$BYTES,\"pagesDownload\":\"PASS\"}" > pages-apk-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: device-bridge-pages-apk-verification
          path: pages-apk-verification.json