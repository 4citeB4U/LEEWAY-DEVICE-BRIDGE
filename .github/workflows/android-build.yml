name: Android Build

concurrency:
  group: leeway-device-bridge-package-publication
  cancel-in-progress: false

on:
  push:
    paths:
      - "apps/android/**"
      - "contracts/**"
      - "tests/**"
      - "clients/remote-controller/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "contracts/**"
      - "tests/**"
      - "clients/remote-controller/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Qualify source and contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
          done

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build compact Android package
        working-directory: apps/android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Measure and hash package
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "package_bytes=$BYTES" | tee package-evidence.txt
          echo "sha256=$SHA" | tee -a package-evidence.txt
          if [ "$BYTES" -gt 104857600 ]; then
            echo "Bootstrap package exceeds LeeWay 100 MiB target."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: leeway-device-bridge-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/package-evidence.txt

      - name: Publish latest verified Android APK to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/downloads
          APK_SRC=apps/android/app/build/outputs/apk/debug/app-debug.apk
          APK_DST=docs/downloads/leeway-device-bridge-android-latest-debug.apk
          cp "$APK_SRC" "$APK_DST"
          BYTES=$(stat -c%s "$APK_DST")
          SHA=$(sha256sum "$APK_DST" | awk '{print $1}')
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' apps/android/app/build.gradle.kts)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          cat > docs/downloads/leeway-device-bridge-android-latest.json <<JSON
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "sha256": "$SHA",
            "sizeBytes": $BYTES,
            "downloadUrl": "./leeway-device-bridge-android-latest-debug.apk",
            "sourceRunId": "${{ github.run_id }}",
            "sourceCommit": "${{ github.sha }}"
          }
          JSON
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          manifest_path = Path("docs/package-manifest.json")
          metadata_path = Path("docs/downloads/leeway-device-bridge-android-latest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          package = next(item for item in manifest["packages"] if item["platform"] == "android")
          package.update({
              "status": "QUALIFIED_ARTIFACT_OWNER_INSTALL_REQUIRED",
              "source": "github-pages",
              "downloadUrl": "./downloads/leeway-device-bridge-android-latest-debug.apk",
              "sha256": metadata["sha256"],
              "sizeBytes": metadata["sizeBytes"],
              "versionName": metadata["versionName"],
              "versionCode": metadata["versionCode"],
              "githubActionsQualification": {
                  "state": "VERIFIED",
                  "runId": int(metadata["sourceRunId"]),
                  "headSha": metadata["sourceCommit"],
                  "apkSizeBytes": metadata["sizeBytes"],
                  "apkSha256": metadata["sha256"],
                  "note": "The Android app checks this manifest on foreground and reconnect, downloads the verified APK, and opens Android's owner-confirmed installer. It does not silently install or erase app data."
              }
          })
          manifest["updatedAtUtc"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "LeeWay Veritas"
          git config user.email "actions@users.noreply.github.com"
          git add docs/downloads/leeway-device-bridge-android-latest-debug.apk docs/downloads/leeway-device-bridge-android-latest.json docs/package-manifest.json
          if git diff --cached --quiet; then
            echo "Published APK unchanged."
            exit 0
          fi
          git commit -m "Publish verified Device Bridge ${VERSION_NAME} APK"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not publish the verified APK after three guarded push attempts." >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
