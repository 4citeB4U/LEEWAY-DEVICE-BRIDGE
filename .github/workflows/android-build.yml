name: Android Build

on:
  push:
    paths:
      - "apps/android/**"
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "contracts/**"
      - "tests/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Qualify source and contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.mjs; do
            echo "=== $test_file ==="
            node "$test_file"
          done

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build compact Android package
        working-directory: apps/android
        run: gradle --no-daemon assembleDebug

      - name: Measure and hash package
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "package_bytes=$BYTES" | tee package-evidence.txt
          echo "sha256=$SHA" | tee -a package-evidence.txt
          if [ "$BYTES" -gt 104857600 ]; then
            echo "Bootstrap package exceeds LeeWay 100 MiB target."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: leeway-device-bridge-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/package-evidence.txt
