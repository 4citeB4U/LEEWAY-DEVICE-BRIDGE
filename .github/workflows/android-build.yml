name: Android Build
on:
  push:
    paths: ["apps/android/**", "contracts/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-build.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: leeway-device-bridge-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
