name: W01 HP Native Security Hold

on:
  push:
    paths:
      - 'operator/hp-native/**'
      - '.github/workflows/hp-native-security-hold.yml'
  pull_request:
    paths:
      - 'operator/hp-native/**'
      - '.github/workflows/hp-native-security-hold.yml'

permissions:
  contents: read

jobs:
  hp-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: HP native security regression tests
        run: node --test operator/hp-native/*.test.mjs