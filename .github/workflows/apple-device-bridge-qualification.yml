name: Apple Device Bridge Qualification

on:
  push:
    paths:
      - "apps/apple/**"
      - "operator/adapter-registry.json"
      - "docs/APPLE-DEVICE-BRIDGE-ADAPTER.md"
      - ".github/workflows/apple-device-bridge-qualification.yml"
  pull_request:
    paths:
      - "apps/apple/**"
      - "operator/adapter-registry.json"
      - "docs/APPLE-DEVICE-BRIDGE-ADAPTER.md"
      - ".github/workflows/apple-device-bridge-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-ios-adapter:
    name: Build unsigned iOS Device Bridge adapter
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Record Apple build toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Enforce the independent runtime boundary
        run: |
          set -euo pipefail
          if rg --line-number --ignore-case 'mlc|llama\.cpp|executorch|mlx' apps/apple/Sources; then
            echo 'A third-party runtime reference entered the iOS Device Bridge source boundary.' >&2
            exit 1
          fi

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          cd apps/apple
          xcodegen generate --spec project.yml

      - name: Build unsigned iPhone source
        run: |
          set -o pipefail
          cd apps/apple
          : > xcodebuild-unsigned.log
          xcodebuild -project LeeWayDeviceBridgeApple.xcodeproj -scheme LeeWayDeviceBridgeApple \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild-unsigned.log

      - name: Package unsigned sideload artifact
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Debug-iphoneos/LeeWayDeviceBridge.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          PACKAGE_ROOT="$RUNNER_TEMP/leeway-device-bridge-apple-package"
          IPA_ROOT="$RUNNER_TEMP/leeway-device-bridge-ipa-root"
          IPA_PATH="$PACKAGE_ROOT/LeeWayDeviceBridge-unsigned.ipa"
          MANIFEST_PATH="$PACKAGE_ROOT/LEEWAY-APPLE-PACKAGE-MANIFEST.json"
          rm -rf "$PACKAGE_ROOT" "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/LeeWayDeviceBridge.app"
          (
            cd "$IPA_ROOT"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )
          unzip -Z1 "$IPA_PATH" | /usr/bin/grep -E '^Payload/LeeWayDeviceBridge\.app/'
          test -s "$IPA_PATH"
          cp apps/apple/AppleNativePackageManifest.json "$MANIFEST_PATH"
          IPA_SHA256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          python3 - "$MANIFEST_PATH" "$GITHUB_SHA" "$IPA_SHA256" <<'PY'
          import json
          import sys

          path, revision, digest = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              manifest = json.load(source)
          manifest["sourceRevision"] = revision
          manifest["artifact"]["fileName"] = "LeeWayDeviceBridge-unsigned.ipa"
          manifest["artifact"]["sha256"] = digest
          with open(path, "w", encoding="utf-8") as destination:
              json.dump(manifest, destination, indent=2)
              destination.write("\n")
          PY
          python3 -m json.tool "$MANIFEST_PATH" >/dev/null

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leeway-device-bridge-apple-unsigned-${{ github.run_id }}
          path: |
            apps/apple/xcodebuild-unsigned.log
            ${{ runner.temp }}/leeway-device-bridge-apple-package
          if-no-files-found: error
          retention-days: 30
